name: publish
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 0 1 * *'
jobs:
  publish-docker-images:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Running this job only for main branch
    steps:
      - uses: actions/checkout@v7
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Publish Docker image for steamrt3 tag
        run: |
              docker build . -t ghcr.io/source2ze/build-containers:steamrt3 -f containers/SteamRT3-Dockerfile
              docker push ghcr.io/source2ze/build-containers:steamrt3
      - name: Build & Publish Docker image for steamrt4 tag
        run: |
              docker build . -t ghcr.io/source2ze/build-containers:steamrt4 -f containers/SteamRT4-Dockerfile
              docker push ghcr.io/source2ze/build-containers:steamrt4